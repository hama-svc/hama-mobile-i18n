home:
  home_care:
    title: "홈케어 하마"
    tooltip: "간편하게 견적받고 시공을 결정 하세요."
    menu:
      big_button: "수리·보수"
      small_button1: "청소"
      small_button2: "인테리어"
    sub_menus: [ 레이디, 긴급출동, A/S요청, 펫 가구 ]
  introduction:
    title: "소개 하마"
    menu:
      house_master:
        title: "하우스 마스터"
        description: "하마가 직접 검증한 믿을 수 있는 전문가"
      how_to_use: "이용방법"
      tip: "내 집 관리 TIP"
  construction:
    title: "시공 하마"
  faq:
    title: "궁금 하마"
    contents:
      - q: "하마는 어떤 서비스인가요?"
        a: "하마는 수리, 청소, 인테리어 등 집과 관련된 서비스를 한 번에 신청할 수 있는 홈케어 플랫폼입니다.\n전문 하우스마스터가 매칭되어 편리하고 안전하게 서비스를 제공합니다."
      - q: "서비스 어떻게 이용 하나요?"
        a: "하마 앱에서 원하는 서비스를 선택한 뒤,\n시공 정보 입력 → 견적 확인 → 시공결정 → 시공진행 → 결제 순으로 간편하게 신청할 수 있습니다."
      - q: "방문 전 전화 상담이 가능한가요?"
        a: "서비스 특성상 추가 정보 확인이 필요한 경우 담당자가 사전 연락을 드릴 수 있습니다.\n언제든 하마 고객센터를 (1533-0474) 통해 상담이 가능합니다."
      - q: "서비스 비용은 어떻게 결정되나요?"
        a: "견적은 서비스 유형과 면적/작업 범위에 따라 책정됩니다.\n현장 상황에 따라 추가 비용이 발생할 수 있으며, 사전 안내 후 진행됩니다.\n견적을 확인 후 고객님이 시공 여/부를 결정 합니다."
      - q: "결제는 언제 이루어지나요?"
        a: "시공 진행 완료 후 결제로 진행됩니다.\n원하실 경우 시공 진행중 언제든 하마 앱을 통해 결제를 하실 수 있습니다."
  bottom:
    card:
      guest:
        title: "내 집 관리 시작하기"
        message: "내 집 정보를 등록하면\n하마가 집에 맞는 관리 혜택을 챙겨드려요."
      default_house_name: "MY HOME"
      address_is_empty: "설정된 정보가 없어요"
